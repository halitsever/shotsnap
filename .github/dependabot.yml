version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # ts-jest supports TypeScript below 7 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Babel 8 needs @babel/core 8 and a babel config migration.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # node-fetch 3 is ESM-only and the package builds to CommonJS.
      - dependency-name: node-fetch
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
